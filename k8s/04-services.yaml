# --- PEDIDOS SERVICE ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedidos-deployment
  namespace: loja-veloz
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pedidos-service
  template:
    metadata:
      labels:
        app: pedidos-service
    spec:
      containers:
        - name: pedidos
          image: loja_veloz_devops-pedidos-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: veloz-config
            - secretRef:
                name: veloz-secrets
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "150m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pedidos-service
  namespace: loja-veloz
spec:
  selector:
    app: pedidos-service
  ports:
    - port: 3001
      targetPort: 3001
---
