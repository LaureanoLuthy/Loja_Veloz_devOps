name: CI/CD Pipeline - Loja Veloz

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-validate:
    name: Validar Manifestos Kubernetes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Validar Sintaxe dos Arquivos YAML (K8s)
        run: |
          python -c "import yaml, glob; [list(yaml.safe_load_all(open(f))) for f in glob.glob('k8s/*.yaml')]"
          echo "Todos os manifestos Kubernetes possuem sintaxe YAML valida!"
          
  build-and-test:
    name: Build das Imagens Docker
    runs-on: ubuntu-latest
    needs: lint-and-validate
    strategy:
      matrix:
        service:
          - api-gateway
          - pedidos-service
          - pagamentos-service
          - estoque-service
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build do serviço ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: false
          tags: loja-veloz/${{ matrix.service }}:latest
          